kind = "web"
previewPath = "/"
title = "Knowbuddy"
version = "1.0.0"
id = "artifacts/knowbuddy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23826

[services.development]
run = "pnpm --filter @workspace/knowbuddy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knowbuddy", "run", "build" ]
publicDir = "artifacts/knowbuddy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23826"
BASE_PATH = "/"
