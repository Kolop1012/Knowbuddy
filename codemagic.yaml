workflows:
  ios-workflow:
    name: Knowbuddy iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: v22
      vars:
        PORT: "5173"
        BASE_PATH: "/"
    scripts:
      - name: Setup pnpm
        script: |
          corepack disable || true
          npm install -g pnpm --force
      - name: Install dependencies
        script: pnpm install --ignore-scripts
      - name: Build web assets
        script: |
          cd artifacts/knowbuddy
          PORT=5173 BASE_PATH="/" pnpm build
      - name: Sync Capacitor iOS
        script: |
          cd artifacts/knowbuddy
          npx cap sync ios
      - name: Build iOS archive
        script: |
          cd artifacts/knowbuddy/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/Knowbuddy.xcarchive" \
            archive
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/Knowbuddy.xcarchive" \
            -exportOptionsPlist /dev/stdin \
            -exportPath "$CM_BUILD_DIR/ipa" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/Knowbuddy.xcarchive
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
